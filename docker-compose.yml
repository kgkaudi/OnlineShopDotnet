services:
  backend:
    build:
      context: ./backend/OnlineShop.Api
    container_name: onlineshop-api

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"

      MongoDB__ConnectionString: "mongodb://host.docker.internal:27017/KostasEvents"
      MongoDB__DatabaseName: "OnlineShopDb"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"

    container_name: onlineshop-web

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped